{% extends "base.html" %}
{% block title %}Complaints Board{% endblock %}
{% block content %}
<h2>Complaints Board</h2>

{% for complaint in complaints %}
<div class="card mb-3">
    <div class="card-body">
        <h5 class="card-title">{{ complaint.agent_name }}</h5>
        <h6 class="card-subtitle mb-2 text-muted">{{ complaint.timestamp.strftime('%Y-%m-%d %H:%M') }}</h6>
        <p class="card-text">{{ complaint.text }}</p>
    </div>
</div>
{% endfor %}

<hr class="my-4">
<h4>Submit a Complaint</h4>
<form method="POST" action="/complaints">
    <div class="mb-3">
        <label for="agent_name" class="form-label">Agent Name</label>
        <input type="text" class="form-control" id="agent_name" name="agent_name" required>
    </div>
    <div class="mb-3">
        <label for="text" class="form-label">Complaint</label>
        <textarea class="form-control" id="text" name="text" rows="3" required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
