{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Complaints Board</h1>

    <div class="mb-4">
        {% for complaint in complaints %}
        <div class="card mb-3">
            <div class="card-body">
                <h5 class="card-title">{{ complaint.agent_name }}</h5>
                <h6 class="card-subtitle mb-2 text-muted">{{ complaint.timestamp.strftime('%Y-%m-%d %H:%M') }}</h6>
                <p class="card-text">{{ complaint.text }}</p>
            </div>
        </div>
        {% else %}
        <p class="text-muted">No complaints yet.</p>
        {% endfor %}
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">Submit a Complaint</h5>
        </div>
        <div class="card-body">
            <form method="POST" action="/complaints">
                <div class="mb-3">
                    <label for="agent_name" class="form-label">Agent Name</label>
                    <input type="text" class="form-control" id="agent_name" name="agent_name" required>
                </div>
                <div class="mb-3">
                    <label for="complaint_text" class="form-label">Complaint</label>
                    <textarea class="form-control" id="complaint_text" name="complaint_text" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
